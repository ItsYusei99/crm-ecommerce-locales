# Integracion continua en Travis CI: corre las pruebas en cada push y pull request
language: python
python:
  - "3.11"
  - "3.12"
branches:
  only:
    - main
    - develop
    - /^release\/.*$/
install:
  - pip install -r requirements.txt
script:
  - python -m pytest -v
notifications:
  email:
    on_success: never
    on_failure: always
