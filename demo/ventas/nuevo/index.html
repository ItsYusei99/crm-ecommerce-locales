<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Ecommerce Locales</title>
  <link rel="stylesheet" href="/crm-ecommerce-locales/demo/static/estilos.css">
<style>form button, form input, form select, form textarea{pointer-events:none;opacity:.55}</style><script>document.addEventListener('submit',e=>e.preventDefault(),true)</script></head>
<body>
  <header>
    <strong>CRM Ecommerce Locales</strong>
    
    <nav>
      <a href="/crm-ecommerce-locales/demo/">Dashboard</a>
      <a href="/crm-ecommerce-locales/demo/clientes/">Clientes</a>
      <a href="/crm-ecommerce-locales/demo/ventas/">Ventas</a>
      <a href="/crm-ecommerce-locales/demo/actividades/">Actividades</a>
      <a href="/crm-ecommerce-locales/demo/auth/usuarios/">Usuarios</a>
      <span class="usuario">Youssef (admin)</span>
      <a href="/crm-ecommerce-locales/demo/auth/logout/">Salir</a>
    </nav>
    
  </header>
  <main><div class="aviso">Demo de solo lectura en GitHub Pages con datos de prueba. Los formularios estan desactivados; para usar el CRM completo correlo en local (ver README).</div>
    
    
<form method="post" class="caja">
  <h1>Nuevo pedido</h1>
  <label>Cliente <select name="id_cliente"><option value="1">Ana Lopez</option><option value="2">Luis Perez</option><option value="3">Maria Ruiz</option></select></label>
  <label>Producto <select name="id_producto"><option value="2">Curso marketing digital ($499.0)</option><option value="1">Playera local ($299.0)</option></select></label>
  <label>Cantidad <input name="cantidad" type="number" min="1" value="1"></label>
  <label>Canal <select name="canal"><option>WA</option><option>IG</option><option>WEB</option></select></label>
  <button>Registrar</button>
</form>

  </main>
</body>
</html>
